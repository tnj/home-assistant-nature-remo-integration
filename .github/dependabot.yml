version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    ignore:
      # Pinned in manifest.json and bumped by hand during releases;
      # Dependabot must not desync uv.lock from the manifest pin.
      - dependency-name: "aionatureremo"
    groups:
      homeassistant:
        # Separate group so a red HA bump (e.g. HA 2026.7 / aiohttp 3.14 /
        # aioresponses conflict) does not block tooling updates.
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
        update-types: ["minor", "patch"]
      python-dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
