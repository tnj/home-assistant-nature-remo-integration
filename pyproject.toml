[project]
name = "nature-remo-ha-workspace"
version = "0.0.0"
description = "Development workspace for the Nature Remo Home Assistant integration"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aionatureremo",
    # Test against at least the minimum HA declared in hacs.json. Without a
    # floor, dependency resolution (e.g. Dependabot security bumps) can
    # silently downgrade HA to ancient releases whose pins don't conflict.
    "homeassistant>=2026.7.4",
    # phcc pins its matching HA exactly; the floor stops the resolver from
    # dodging that pin by falling back to fossil phcc releases. The resolved
    # HA therefore follows the newest phcc, which tracks HA releases daily.
    "pytest-homeassistant-custom-component>=0.13",
    # pytest and pytest-cov are invoked directly (CI runs with --cov) but
    # otherwise only arrive transitively via phcc; pin explicit floors so
    # the resolver can't dodge the versions the invocations assume.
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "D", "E", "F", "I", "PERF", "PT", "RET", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/nature_remo"]
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
